name: Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Get next version
        id: version
        run: |
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?$' | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            NEXT_VERSION="1.0.0"
          else
            MAJOR=$(echo "$LATEST_TAG" | cut -d. -f1)
            MINOR=$(echo "$LATEST_TAG" | cut -d. -f2)
            PATCH=$(echo "$LATEST_TAG" | cut -d. -f3)
            [ -z "$PATCH" ] && PATCH=0
            NEXT_MINOR=$((MINOR + 1))
            NEXT_VERSION="$MAJOR.$NEXT_MINOR.0"
          fi
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEXT_VERSION"

      - name: Build binaries
        run: |
          mkdir -p dist
          VERSION="${{ steps.version.outputs.version }}"
          GOOS=windows GOARCH=amd64 go build -ldflags "-X main.version=$VERSION" -o dist/switchtool.exe .
          GOOS=windows GOARCH=arm64 go build -ldflags "-X main.version=$VERSION" -o dist/switchtool-arm64.exe .

      - name: Download NuGet CLI
        run: curl -sS -L https://dist.nuget.org/win-x86-commandline/latest/nuget.exe -o /tmp/nuget.exe

      - name: Build Chocolatey package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p chocolatey/switchtool/tools
          cp dist/switchtool.exe chocolatey/switchtool/tools/
          cp LICENSE chocolatey/switchtool/tools/LICENSE.txt

          {
            echo "VERIFICATION"
            echo "Verification is intended to assist the Chocolatey moderators and community"
            echo "in verifying that this package contents are trustworthy."
            echo ""
            echo "This package is published by the software author (Programmercito)."
            echo "The binary was built from: https://github.com/Programmercito/switcher-version-tools/releases/tag/${VERSION}"
            echo "using the GitHub Actions workflow defined in the repository."
            echo "You can verify the build by inspecting the workflow run and reproducing it."
          } > chocolatey/switchtool/tools/VERIFICATION.txt

          sed "s/__VERSION__/${VERSION}/" .github/switchtool.nuspec.template \
            > chocolatey/switchtool/switchtool.nuspec

          mono /tmp/nuget.exe pack chocolatey/switchtool/switchtool.nuspec -OutputDirectory dist -NonInteractive
          find dist -name "switchtool.*.nupkg" | head -1 | xargs -I{} mv {} dist/switchtool.${VERSION}.nupkg

      - name: Publish to Chocolatey
        if: ${{ env.CHOCO_API_KEY != '' }}
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # push.chocolatey.org's WAF blocks requests without a recognizable client User-Agent
          # (returns a bare IIS 403 page); --fail-with-body surfaces real HTTP errors instead of
          # silently exiting 0 with an error page printed to stdout.
          curl -sS -L --fail-with-body -X PUT https://push.chocolatey.org/api/v2/package \
            -H "X-NuGet-ApiKey: $CHOCO_API_KEY" \
            -H "User-Agent: Chocolatey Command Line/2.2.2" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@dist/switchtool.${VERSION}.nupkg"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/switchtool.exe
            dist/switchtool-arm64.exe
            dist/switchtool.*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
