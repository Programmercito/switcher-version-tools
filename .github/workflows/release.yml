name: Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.checksums.outputs.sha256 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Get next version
        id: version
        run: |
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?$' | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            NEXT_VERSION="1.0.0"
          else
            MAJOR=$(echo "$LATEST_TAG" | cut -d. -f1)
            MINOR=$(echo "$LATEST_TAG" | cut -d. -f2)
            PATCH=$(echo "$LATEST_TAG" | cut -d. -f3)
            [ -z "$PATCH" ] && PATCH=0
            NEXT_MINOR=$((MINOR + 1))
            NEXT_VERSION="$MAJOR.$NEXT_MINOR.0"
          fi
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEXT_VERSION"

      - name: Build binaries
        run: |
          mkdir -p dist
          VERSION="${{ steps.version.outputs.version }}"
          GOOS=windows GOARCH=amd64 go build -ldflags "-X main.version=$VERSION" -o dist/switchtool.exe .
          GOOS=windows GOARCH=arm64 go build -ldflags "-X main.version=$VERSION" -o dist/switchtool-arm64.exe .

      - name: Compute release checksums
        id: checksums
        run: |
          SHA256=$(sha256sum dist/switchtool.exe | awk '{print $1}')
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

  chocolatey:
    name: Build and Publish Chocolatey package
    runs-on: windows-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist

      - name: Build Chocolatey package
        shell: bash
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          SHA256="${{ needs.build.outputs.sha256 }}"
          PKG_ID="switchtool-cli"
          PKG_DIR="chocolatey/${PKG_ID}"
          mkdir -p "${PKG_DIR}/tools"
          cp LICENSE "${PKG_DIR}/tools/LICENSE.txt"

          cat > "${PKG_DIR}/tools/chocolateyInstall.ps1" << 'PSEOF'
          $ErrorActionPreference = 'Stop'
          $packageName = 'switchtool-cli'
          PSEOF

          cat >> "${PKG_DIR}/tools/chocolateyInstall.ps1" << PSEOF
          \$url64      = "https://github.com/Programmercito/switcher-version-tools/releases/download/${VERSION}/switchtool.exe"
          \$checksum64 = "${SHA256}"
          PSEOF

          cat >> "${PKG_DIR}/tools/chocolateyInstall.ps1" << 'PSEOF'
          $packageArgs = @{
            packageName    = $packageName
            fileType       = 'exe'
            url64bit       = $url64
            checksum64     = $checksum64
            checksumType64 = 'sha256'
            silentArgs     = ''
            validExitCodes = @(0)
          }
          Install-ChocolateyPackage @packageArgs
          PSEOF

          cat > "${PKG_DIR}/${PKG_ID}.nuspec" << NUEOF
          <?xml version="1.0" encoding="utf-8"?>
          <package xmlns="http://schemas.microsoft.com/packaging/2015/06/nuspec.xsd">
            <metadata>
              <id>${PKG_ID}</id>
              <version>${VERSION}</version>
              <title>switchtool-cli - Version Manager for Windows</title>
              <authors>Programmercito</authors>
              <owners>Programmercito</owners>
              <requireLicenseAcceptance>false</requireLicenseAcceptance>
              <licenseUrl>https://raw.githubusercontent.com/Programmercito/switcher-version-tools/main/LICENSE</licenseUrl>
              <iconUrl>https://raw.githubusercontent.com/Programmercito/switcher-version-tools/main/images/switcheo.png</iconUrl>
              <projectUrl>https://github.com/Programmercito/switcher-version-tools</projectUrl>
              <projectSourceUrl>https://github.com/Programmercito/switcher-version-tools</projectSourceUrl>
              <packageSourceUrl>https://github.com/Programmercito/switcher-version-tools/tree/main/chocolatey/switchtool-cli</packageSourceUrl>
              <docsUrl>https://github.com/Programmercito/switcher-version-tools#readme</docsUrl>
              <bugTrackerUrl>https://github.com/Programmercito/switcher-version-tools/issues</bugTrackerUrl>
              <releaseNotes>https://github.com/Programmercito/switcher-version-tools/releases</releaseNotes>
              <copyright>Copyright 2026 Programmercito</copyright>
              <summary>CLI para cambiar entre versiones de Java, Maven, Gradle, PHP, Go y Node en Windows.</summary>
              <description>switchtool es un CLI para Windows que permite gestionar y cambiar rapidamente entre versiones de Java (JDK), Maven, Gradle, PHP, Go y Node.js. Automatiza la descarga, extraccion y configuracion de variables de entorno y PATH. Soporta archivos .zip, .tar.gz y .tgz.</description>
              <tags>switchtool switchtool-cli java jdk maven gradle php go node version manager</tags>
            </metadata>
            <files>
              <file src="tools/**" target="tools" />
            </files>
          </package>
          NUEOF

          cd "${PKG_DIR}"
          choco pack "${PKG_ID}.nuspec" --out ../../dist

      - name: Publish to Chocolatey
        if: ${{ env.CHOCO_API_KEY != '' }}
        shell: bash
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          choco push "dist/switchtool-cli.${VERSION}.nupkg" \
            --source https://push.chocolatey.org/ \
            --api-key "$CHOCO_API_KEY"

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, chocolatey]
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: |
            dist/switchtool.exe
            dist/switchtool-arm64.exe
            dist/switchtool-cli.*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
