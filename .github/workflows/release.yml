name: Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -o dist/switch-tools-windows-amd64.exe .
          GOOS=linux GOARCH=amd64 go build -o dist/switch-tools-linux-amd64 .
          GOOS=darwin GOARCH=amd64 go build -o dist/switch-tools-darwin-amd64 .

      - name: Set release tag
        id: release_tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          prerelease: ${{ fromJSON(steps.release_tag.outputs.prerelease) }}
          files: |
            dist/switch-tools-windows-amd64.exe
            dist/switch-tools-linux-amd64
            dist/switch-tools-darwin-amd64
          token: ${{ secrets.GITHUB_TOKEN }}
