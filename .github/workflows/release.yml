name: Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Get next version
        id: version
        run: |
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?$' | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            NEXT_VERSION="1.0.0"
          else
            MAJOR=$(echo "$LATEST_TAG" | cut -d. -f1)
            MINOR=$(echo "$LATEST_TAG" | cut -d. -f2)
            PATCH=$(echo "$LATEST_TAG" | cut -d. -f3)
            [ -z "$PATCH" ] && PATCH=0
            NEXT_MINOR=$((MINOR + 1))
            NEXT_VERSION="$MAJOR.$NEXT_MINOR.0"
          fi
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEXT_VERSION"

      - name: Build binaries
        run: |
          mkdir -p dist
          VERSION="${{ steps.version.outputs.version }}"
          GOOS=windows GOARCH=amd64 go build -ldflags "-X main.version=$VERSION" -o dist/switchtool.exe .
          GOOS=windows GOARCH=arm64 go build -ldflags "-X main.version=$VERSION" -o dist/switchtool-arm64.exe .

      - name: Compute release checksums
        id: checksums
        run: |
          SHA256=$(sha256sum dist/switchtool.exe | awk '{print $1}')
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Build Chocolatey package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA256="${{ steps.checksums.outputs.sha256 }}"
          mkdir -p chocolatey/switchtool/tools
          cp LICENSE chocolatey/switchtool/tools/LICENSE.txt

          cat > chocolatey/switchtool/tools/chocolateyInstall.ps1 << 'PSEOF'
$ErrorActionPreference = 'Stop'
$packageName = 'switchtool'
$url64       = "https://github.com/Programmercito/switcher-version-tools/releases/download/__VERSION__/switchtool.exe"
$checksum64  = "__SHA256__"

$packageArgs = @{
  packageName    = $packageName
  fileType       = 'exe'
  url64bit       = $url64
  checksum64     = $checksum64
  checksumType64 = 'sha256'
  silentArgs     = ''
  validExitCodes = @(0)
}

Get-ChocolateyWebFile @packageArgs -destination "$env:ChocolateyInstall\bin\switchtool.exe"
PSEOF
          sed -i "s|__VERSION__|${VERSION}|g; s|__SHA256__|${SHA256}|g" \
            chocolatey/switchtool/tools/chocolateyInstall.ps1

          sed "s/__VERSION__/${VERSION}/" .github/switchtool.nuspec.template \
            > chocolatey/switchtool/switchtool.nuspec

          python3 .github/build_nupkg.py "$VERSION"

      - name: Set up .NET
        if: ${{ env.CHOCO_API_KEY != '' }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Publish to Chocolatey
        if: ${{ env.CHOCO_API_KEY != '' }}
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          dotnet nuget push "dist/switchtool.${VERSION}.nupkg" \
            --source https://push.chocolatey.org/api/v2/package/ \
            --api-key "$CHOCO_API_KEY"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/switchtool.exe
            dist/switchtool-arm64.exe
            dist/switchtool.*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
