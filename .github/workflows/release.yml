name: Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Get next version
        id: version
        run: |
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?$' | head -n1)
          if [ -z "$LATEST_TAG" ]; then
            NEXT_VERSION="1.0.0"
          else
            MAJOR=$(echo "$LATEST_TAG" | cut -d. -f1)
            MINOR=$(echo "$LATEST_TAG" | cut -d. -f2)
            PATCH=$(echo "$LATEST_TAG" | cut -d. -f3)
            [ -z "$PATCH" ] && PATCH=0
            NEXT_MINOR=$((MINOR + 1))
            NEXT_VERSION="$MAJOR.$NEXT_MINOR.0"
          fi
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEXT_VERSION"

      - name: Build binaries
        run: |
          mkdir -p dist
          VERSION="${{ steps.version.outputs.version }}"
          GOOS=windows GOARCH=amd64 go build -ldflags "-X main.version=$VERSION" -o dist/switchtool.exe .
          GOOS=windows GOARCH=arm64 go build -ldflags "-X main.version=$VERSION" -o dist/switchtool-arm64.exe .

      - name: Build Chocolatey package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p chocolatey/switchtool/tools chocolatey/switchtool/_rels
          cp dist/switchtool.exe chocolatey/switchtool/tools/
          cp LICENSE chocolatey/switchtool/tools/LICENSE.txt

          printf '%s\n' \
            'VERIFICATION' \
            'Verification is intended to assist the Chocolatey moderators and community' \
            'in verifying that this package contents are trustworthy.' \
            '' \
            'This package is published by the software author (Programmercito).' \
            "The binary included in this package was built from the source at:" \
            "https://github.com/Programmercito/switcher-version-tools/releases/tag/${VERSION}" \
            'using the GitHub Actions workflow defined in the repository.' \
            'You can verify the build by inspecting the workflow run and reproducing it.' > chocolatey/switchtool/tools/VERIFICATION.txt

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<package xmlns="http://schemas.microsoft.com/packaging/2015/06/nuspec.xsd">' \
            '  <metadata>' \
            '    <id>switchtool</id>' \
            '    <version>'"${VERSION}"'</version>' \
            '    <title>switchtool - Version Manager for Windows</title>' \
            '    <authors>Programmercito</authors>' \
            '    <owners>Programmercito</owners>' \
            '    <requireLicenseAcceptance>false</requireLicenseAcceptance>' \
            '    <license type="expression">MIT</license>' \
            '    <licenseUrl>https://raw.githubusercontent.com/Programmercito/switcher-version-tools/main/LICENSE</licenseUrl>' \
            '    <iconUrl>https://raw.githubusercontent.com/Programmercito/switcher-version-tools/main/images/switcheo.png</iconUrl>' \
            '    <projectUrl>https://github.com/Programmercito/switcher-version-tools</projectUrl>' \
            '    <projectSourceUrl>https://github.com/Programmercito/switcher-version-tools</projectSourceUrl>' \
            '    <packageSourceUrl>https://github.com/Programmercito/switcher-version-tools/tree/main/chocolatey/switchtool</packageSourceUrl>' \
            '    <docsUrl>https://github.com/Programmercito/switcher-version-tools#readme</docsUrl>' \
            '    <bugTrackerUrl>https://github.com/Programmercito/switcher-version-tools/issues</bugTrackerUrl>' \
            '    <releaseNotes>https://github.com/Programmercito/switcher-version-tools/releases</releaseNotes>' \
            '    <copyright>Copyright 2026 Programmercito</copyright>' \
            '    <summary>CLI para cambiar entre versiones de Java, Maven, Gradle, PHP, Go y Node en Windows.</summary>' \
            '    <description>switchtool es un CLI para Windows que permite gestionar y cambiar rapidamente entre versiones de Java (JDK), Maven, Gradle, PHP, Go y Node.js. Automatiza la descarga, extraccion y configuracion de variables de entorno y PATH. Soporta archivos .zip, .tar.gz y .tgz.</description>' \
            '    <tags>switchtool java jdk maven gradle php go node version manager</tags>' \
            '  </metadata>' \
            '  <files>' \
            '    <file src="tools/**" target="tools" />' \
            '  </files>' \
            '</package>' > chocolatey/switchtool/switchtool.nuspec

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' \
            '  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' \
            '  <Default Extension="nuspec" ContentType="application/octet"/>' \
            '  <Default Extension="exe" ContentType="application/octet"/>' \
            '</Types>' > chocolatey/switchtool/\[Content_Types\].xml

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' \
            '  <Relationship Type="http://schemas.microsoft.com/packaging/2010/07/manifest" Target="/switchtool.nuspec" Id="R1" />' \
            '</Relationships>' > chocolatey/switchtool/_rels/.rels

          cd chocolatey/switchtool
          zip -r ../../dist/switchtool.${VERSION}.nupkg .

      - name: Publish to Chocolatey
        if: ${{ env.CHOCO_API_KEY != '' }}
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # push.chocolatey.org's WAF blocks requests without a recognizable client User-Agent
          # (returns a bare IIS 403 page); --fail-with-body surfaces real HTTP errors instead of
          # silently exiting 0 with an error page printed to stdout.
          curl -sS -L --fail-with-body -X PUT https://push.chocolatey.org/api/v2/package \
            -H "X-NuGet-ApiKey: $CHOCO_API_KEY" \
            -H "User-Agent: Chocolatey Command Line/2.2.2" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@dist/switchtool.${VERSION}.nupkg"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/switchtool.exe
            dist/switchtool-arm64.exe
            dist/switchtool.*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
