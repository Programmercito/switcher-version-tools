name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -o dist/switch-tools-windows-amd64.exe .
          GOOS=linux GOARCH=amd64 go build -o dist/switch-tools-linux-amd64 .
          GOOS=darwin GOARCH=amd64 go build -o dist/switch-tools-darwin-amd64 .

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/switch-tools-windows-amd64.exe
            dist/switch-tools-linux-amd64
            dist/switch-tools-darwin-amd64
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
